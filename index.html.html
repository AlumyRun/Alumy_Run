<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RunnerCore — Treinador de Corrida Digital</title>
  
  <!-- Fontes Google (Inter & JetBrains Mono para tempos/paces) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Feather Icons CDN -->
  <script src="https://unpkg.com/feather-icons"></script>
  
  <!-- Estilos da Aplicação -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>

  <!-- SIDEBAR (DESKTOP) -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon"><i data-feather="zap"></i></div>
      <div class="brand-title">RunnerCore</div>
    </div>
    <nav class="nav-menu">
      <a class="nav-item active" data-target="dashboard"><i data-feather="grid"></i> Dashboard</a>
      <a class="nav-item" data-target="calendar"><i data-feather="calendar"></i> Calendário</a>
      <a class="nav-item" data-target="workouts"><i data-feather="activity"></i> Treinos</a>
      <a class="nav-item" data-target="evolution"><i data-feather="trending-up"></i> Evolução</a>
      <a class="nav-item" data-target="records"><i data-feather="award"></i> RPs</a>
      <a class="nav-item" data-target="races"><i data-feather="flag"></i> Provas</a>
      <a class="nav-item" data-target="profile"><i data-feather="user"></i> Perfil</a>
    </nav>
    <div class="sidebar-footer">
      <small>Atleta: <strong id="sidebar-athlete-name">--</strong></small>
    </div>
  </aside>

  <!-- MOBILE NAV (BOTTOM) -->
  <nav class="mobile-nav">
    <a class="nav-item active" data-target="dashboard"><i data-feather="grid"></i> <span>Home</span></a>
    <a class="nav-item" data-target="calendar"><i data-feather="calendar"></i> <span>Agenda</span></a>
    <a class="nav-item" data-target="workouts"><i data-feather="activity"></i> <span>Treinos</span></a>
    <a class="nav-item" data-target="evolution"><i data-feather="trending-up"></i> <span>Evolução</span></a>
    <a class="nav-item" data-target="races"><i data-feather="flag"></i> <span>Provas</span></a>
  </nav>

  <!-- ÁREA PRINCIPAL -->
  <main class="main-content">
    <section id="view-dashboard" class="view-section"></section>
    <section id="view-calendar" class="view-section" style="display: none;"></section>
    <section id="view-workouts" class="view-section" style="display: none;"></section>
    <section id="view-evolution" class="view-section" style="display: none;"></section>
    <section id="view-records" class="view-section" style="display: none;"></section>
    <section id="view-races" class="view-section" style="display: none;"></section>
    <section id="view-profile" class="view-section" style="display: none;"></section>
  </main>

  <!-- MODAL CONTAINER (DINÂMICO VIA MODALMANAGER) -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-container" id="modal-container">
      <!-- Conteúdo injetado via JS -->
    </div>
  </div>

  <!-- PONTO DE ENTRADA DA APLICAÇÃO JS (MÓDULO ES6) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
